<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เค้าขอโทษนะ 🤍</title>

<style>
body{
    margin:0;
    padding:0;
    background: linear-gradient(135deg,#ff758c,#ff7eb3);
    font-family:sans-serif;
    text-align:center;
    color:white;
    overflow:hidden;
}

.container{
    margin-top:120px;
}

h1{
    font-size:36px;
}

p{
    font-size:20px;
    width:80%;
    margin:auto;
}

button{
    margin-top:30px;
    padding:15px 30px;
    border:none;
    border-radius:30px;
    font-size:18px;
    background:white;
    color:#ff4b6e;
    cursor:pointer;
}

.heart{
    position:fixed;
    animation:floatUp 4s linear forwards;
}

@keyframes floatUp{
    0%{transform:translateY(0);opacity:1;}
    100%{transform:translateY(-600px);opacity:0;}
}
</style>
</head>

<body>

<div class="container">
    <h1>เค้าขอโทษนะ 🥺</h1>
    <p>
        เค้าอาจทำให้เธอเสียใจ  
        แต่เธอคือคนสำคัญที่สุดของเค้านะ  
        ดีกับเค้าหน่อยน้าา 💕
    </p>
    <button onclick="love()">กดตรงนี้สิ 🤍</button>
</div>

<script>
function love(){
    alert("เค้ารักเธอที่สุดเลย 💖");

    for(let i=0;i<50;i++){
        let heart=document.createElement("div");
        heart.innerHTML="💖";
        heart.className="heart";
        heart.style.left=Math.random()*100+"vw";
        heart.style.bottom="0px";
        heart.style.fontSize=(Math.random()*20+15)+"px";
        document.body.appendChild(heart);

        setTimeout(()=>{heart.remove();},4000);
    }
}
</script>

</body>
</html>
